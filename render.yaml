# Blueprint Render : Laito en un seul service web gratuit (API + PWA).
# Base de données : Neon (PostgreSQL gratuit). Images : stockage compatible S3.
# Guide pas à pas : docs/DEPLOIEMENT.md
services:
  - type: web
    name: laito
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    # Déploie seulement quand la CI GitHub est verte.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # Images : stockage compatible S3 (le disque des services gratuits est effacé à chaque redémarrage).
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      # E-mails (vérification, mot de passe) : SMTP gratuit, par ex. Brevo.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
