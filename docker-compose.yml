name: laito-api

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: laito
      POSTGRES_PASSWORD: laito
      POSTGRES_DB: laito
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U laito']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025'
      - '1025:1025'
    profiles: ['mail']

  api:
    build: .
    profiles: ['app']
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://laito:laito@postgres:5432/laito
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
